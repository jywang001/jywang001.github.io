{% assign visual = include.project %}
<div class="project-visual project-visual--{{ visual.visual_style | default: 'diagram' }}" role="img" aria-label="{{ visual.image_alt | escape }}">
  {% if visual.visual_style == 'reader' %}
  <div class="visual-window"><div class="visual-window-bar" aria-hidden="true"><i></i><i></i><i></i><span>README</span></div><div class="visual-reader-crop"><img src="{{ visual.image | relative_url }}" alt="" loading="lazy" width="2940" height="1452"></div></div>
  {% elsif visual.visual_style == 'phones' %}
  <div class="visual-phone visual-phone--secondary"><img src="{{ visual.image_secondary | relative_url }}" alt="" loading="lazy" width="1320" height="2868"></div>
  <div class="visual-phone visual-phone--primary"><img src="{{ visual.image | relative_url }}" alt="" loading="lazy" width="1320" height="2868"></div>
  {% elsif visual.visual_style == 'game' or visual.visual_style == 'conversation' %}
  <div class="visual-window"><div class="visual-window-bar" aria-hidden="true"><i></i><i></i><i></i></div><div class="visual-screen"><img src="{{ visual.image | relative_url }}" alt="" loading="lazy"></div></div>
  {% else %}
  <img src="{{ visual.image | relative_url }}" alt="" loading="lazy" width="960" height="600">
  {% endif %}
</div>
