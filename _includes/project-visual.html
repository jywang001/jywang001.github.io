{% assign visual = include.project %}
<div class="project-visual project-visual--{{ visual.visual_style | default: 'figure' }}" role="img" aria-label="{{ visual.image_alt | escape }}">
  {% if visual.visual_style == 'reader' %}
  <div class="visual-reader-crop"><img src="{{ visual.image | relative_url }}" alt="" loading="lazy" width="2940" height="1452"></div>
  {% elsif visual.visual_style == 'phones' %}
  <img src="{{ visual.image_secondary | relative_url }}" alt="" loading="lazy" width="1320" height="2868">
  <img src="{{ visual.image | relative_url }}" alt="" loading="lazy" width="1320" height="2868">
  {% else %}
  <img src="{{ visual.image | relative_url }}" alt="" loading="lazy">
  {% endif %}
</div>
