<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteerRSI · 谁来给 AI 科学家掌舵？</title>
<meta name="description" content="SteerRSI：在固定题目与预算下，比较 AI 自主、外部点选、外部批评三组掌舵方式。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261117b">
<link rel="stylesheet" href="steer.css?v=20261117b">
<script>try{var t=localStorage.getItem('steer-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="masthead">
  <div class="wrap">
    <div class="pill">
      <a class="brand" href="#top"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="16" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle class="planet" cx="27.5" cy="16" r="2.6"/></svg><span>Steer<em>RSI</em></span></a>
      <nav aria-label="目录"><a href="#takeaways">主要发现</a><a href="#curve">平均曲线</a><a href="#tasks">任务</a></nav>
      <button class="theme" id="theme-toggle" type="button" aria-label="切换明暗主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <p class="eyebrow">AI 科学家 · 受控对照 · 2026</p>
      <h1>Steer<em>RSI</em></h1>
    </div>
    <div class="hero-side">
      <p class="hero-q">谁来给 AI 科学家<em>掌舵？</em></p>
      <p class="lede">同一题目、同一模型、同一预算，只换“谁来选下一个假设”：A 组 AI 自己选，B 组外部决策者点选，C 组外部决策者写批评、AI 再选。</p>
      <div class="facts" id="facts"></div>
      <p class="muted small" id="tldr-status"></p>
    </div>
  </div>
</section>

<section class="sec" id="takeaways">
  <div class="wrap">
    <div class="sec-head"><p class="eyebrow">主要发现</p><h2>结论</h2></div>
    <div id="takeaways-body" class="doc"><p class="muted">加载中…</p></div>
  </div>
</section>

<section class="sec" id="curve">
  <div class="wrap">
    <div class="sec-head"><p class="eyebrow">所有任务的平均</p><h2>20 轮里，三组各走了多远</h2></div>
    <p class="note first">每个任务的起点是冻结基线（记 0%），满分记 100%；曲线是 17 个任务“截至本轮最好分数”的平均，只看验证集。</p>
    <div class="legend" id="legend-curve"></div>
    <div class="card chart-card"><div id="mean-curve" class="chart"></div></div>
  </div>
</section>

<section class="sec" id="tasks">
  <div class="wrap">
    <div class="sec-head"><p class="eyebrow">任务</p><h2>点进任务，看每一轮</h2></div>
    <div id="task-grid" class="task-grid"></div>
  </div>
</section>
</main>

<footer class="footer"><div class="wrap"><span>SteerRSI · Junyang Wang</span></div></footer>

<div id="tooltip" class="tooltip" role="status" hidden></div>
<script src="app.js?v=20261117b"></script>
<script>document.getElementById('theme-toggle').addEventListener('click',function(){var d=document.documentElement,c=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),n=c==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('steer-theme',n)}catch(e){}});</script>
</body>
</html>
