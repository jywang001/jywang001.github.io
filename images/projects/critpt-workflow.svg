<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">CritPT-RL scientific coding workflow</title>
  <desc id="desc">An illustrative scientific task and Python answer, above a workflow for model rollouts, verifiable rewards, GRPO training, and checkpoint evaluation with feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#47789a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#6a9386" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#f3f6f8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="65" fill="#263d53" font-size="34" font-weight="700" letter-spacing="-1">CritPT-RL</text>
    <text x="912" y="60" text-anchor="end" fill="#47789a" font-size="15" font-weight="600" letter-spacing="2">SCIENTIFIC CODE · POST-TRAINING</text>

    <rect x="48" y="108" width="270" height="224" rx="18" fill="#fff" stroke="#d6e1e8" stroke-width="2"/>
    <rect x="70" y="130" width="61" height="28" rx="7" fill="#eaf0f4"/>
    <text x="100" y="149" text-anchor="middle" fill="#47789a" font-size="13" font-weight="700" letter-spacing="1.3">TASK</text>
    <text x="70" y="204" fill="#263d53" font-size="32" font-weight="600" letter-spacing="-.6">Scientific</text>
    <text x="70" y="245" fill="#263d53" font-size="32" font-weight="600" letter-spacing="-.6">problem</text>
    <path d="M 71 280 H 214 M 71 294 H 259" stroke="#d6e1e8" stroke-width="5" stroke-linecap="round"/>

    <path d="M 333 220 H 370" fill="none" stroke="#47789a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="390" y="108" width="522" height="224" rx="18" fill="#263d53"/>
    <path d="M 390 164 H 912" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="416" cy="137" r="5" fill="#6a9386"/>
    <circle cx="434" cy="137" r="5" fill="#a4bccb" fill-opacity=".65"/>
    <circle cx="452" cy="137" r="5" fill="#a4bccb" fill-opacity=".35"/>
    <text x="886" y="142" text-anchor="end" fill="#bbceda" font-size="13" letter-spacing="1.5">PYTHON ANSWER</text>
    <g font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="26">
      <text x="418" y="213" fill="#fff"><tspan fill="#a9d0e6">def</tspan> answer():</text>
      <text x="449" y="256" fill="#cad8e1">result = solve()</text>
      <text x="449" y="299" fill="#cad8e1"><tspan fill="#a9d0e6">return</tspan> result</text>
    </g>

    <g fill="none" stroke="#47789a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 249 449 H 266"/>
      <path d="M 472 449 H 489"/>
      <path d="M 695 449 H 712"/>
    </g>

    <g stroke-width="2">
      <rect x="48" y="388" width="195" height="116" rx="14" fill="#fff" stroke="#d6e1e8"/>
      <rect x="271" y="388" width="195" height="116" rx="14" fill="#fff" stroke="#d6e1e8"/>
      <rect x="494" y="388" width="195" height="116" rx="14" fill="#e5edf3" stroke="#b8cbd8"/>
      <rect x="717" y="388" width="195" height="116" rx="14" fill="#eaf1ee" stroke="#c3d7ce"/>
    </g>
    <g font-size="25" font-weight="600" fill="#263d53" text-anchor="middle">
      <text x="145" y="436">Generate</text>
      <text x="368" y="436">Verify</text>
      <text x="591" y="436">Train</text>
      <text x="814" y="436">Evaluate</text>
    </g>
    <g font-size="17" fill="#597186" text-anchor="middle">
      <text x="145" y="469">Model rollouts</text>
      <text x="368" y="469">Verifiable rewards</text>
      <text x="591" y="469">GRPO updates</text>
      <text x="814" y="469">Checkpoint tests</text>
    </g>

    <path d="M 814 513 V 532 Q 814 550 796 550 H 164 Q 145 550 145 532 V 514" fill="none" stroke="#6a9386" stroke-width="2" marker-end="url(#feedback-arrow)"/>
    <rect x="372" y="537" width="216" height="25" rx="8" fill="#f3f6f8"/>
    <text x="480" y="556" text-anchor="middle" fill="#6a9386" font-size="17">Evaluation feedback</text>
  </g>
