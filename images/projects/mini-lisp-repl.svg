<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Mini-Lisp REPL examples</title>
  <desc id="description">Two real interpreter examples: mapping a square function over the list 1, 2, 3 returns 1, 4, 9; reducing addition over 1, 2, 3, 4 returns 10.</desc>
  <rect width="960" height="600" fill="#f1f4f6"/>
  <rect x="56" y="72" width="848" height="472" rx="18" fill="#dce2e8"/>
  <rect x="56" y="60" width="848" height="472" rx="18" fill="#15202e"/>
  <path d="M74 60h812a18 18 0 0 1 18 18v46H56V78a18 18 0 0 1 18-18Z" fill="#1d2a3b"/>
  <path d="M56 124h848" stroke="#344154"/>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="92" y="100" fill="#eef2f7" font-size="17" font-weight="600">Mini-Lisp <tspan fill="#8393a8" font-weight="400">/ REPL</tspan></text>
    <text x="868" y="100" fill="#a7b5c6" font-size="13" text-anchor="end">C++ interpreter</text>
    <g font-size="23" xml:space="preserve">
      <text x="92" y="214" fill="#7890ac">&gt;&gt;&gt;</text>
      <text x="156" y="214" fill="#eef2f7">(<tspan fill="#a6caec">map</tspan> (<tspan fill="#a6caec">lambda</tspan> (n) (* n n)) (<tspan fill="#a6caec">list</tspan> <tspan fill="#92cbbd">1 2 3</tspan>))</text>
      <text x="156" y="262" fill="#a4d3c6">(1 4 9)</text>
      <text x="92" y="360" fill="#7890ac">&gt;&gt;&gt;</text>
      <text x="156" y="360" fill="#eef2f7">(<tspan fill="#a6caec">reduce</tspan> + (<tspan fill="#a6caec">list</tspan> <tspan fill="#92cbbd">1 2 3 4</tspan>))</text>
      <text x="156" y="408" fill="#a4d3c6">10</text>
    </g>
    <path d="M92 458h776" stroke="#2d3c4f"/>
    <text x="92" y="495" fill="#91a1b5" font-size="14">Lexical scope</text>
    <circle cx="237" cy="490" r="2" fill="#50657e"/>
    <text x="256" y="495" fill="#91a1b5" font-size="14">Lists</text>
    <circle cx="319" cy="490" r="2" fill="#50657e"/>
    <text x="338" y="495" fill="#91a1b5" font-size="14">Higher-order functions</text>
  </g>
</svg>
